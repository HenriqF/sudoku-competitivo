services:
  db:
    image: mysql:8.0
    container_name: mysql-sudoku-bd
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: